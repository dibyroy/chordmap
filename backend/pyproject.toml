[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chordmap-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "autochord>=0.1",
    "whisperx>=3.1",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "mir_eval>=0.7",
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "python-multipart>=0.0.9",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api", "evals"]
